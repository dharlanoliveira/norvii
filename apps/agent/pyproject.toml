[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "norvii-agent"
version = "0.1.0"
description = "LangGraph orchestration service for Norvii grounded research"
requires-python = ">=3.13,<3.14"
dependencies = [
  "langgraph==1.0.5",
  "psycopg[binary]==3.3.4",
]

[project.scripts]
norvii-agent = "norvii_agent.transport.__main__:main"

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/norvii_agent"]

[tool.pytest.ini_options]
addopts = "--strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D107", "D203", "D213", "EM101", "EM102", "T201", "TC003", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "INP001", "PLR2004", "S101", "S105"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["norvii_agent"]

[tool.uv]
required-version = ">=0.11.0,<0.12.0"
