id: "norvii-sdd-standards"
extends: "speckit"
priority: 5
enabled: true
edits:
  - insert_after: specify
    step:
      id: specification-quality
      type: if
      condition: "{{ true }}"
      then:
        - id: clarify
          command: speckit.clarify
          integration: "{{ inputs.integration }}"
          input:
            args: "{{ inputs.spec }}"
        - id: checklist
          command: speckit.checklist
          integration: "{{ inputs.integration }}"
          input:
            args: "{{ inputs.spec }}"

  - replace: review-spec
    step:
      id: review-spec
      type: gate
      message: "Confirm that the specification is unambiguous, testable, corpus-bounded where applicable, and accepted before planning."
      options: [approve, reject]
      on_reject: abort

  - replace: review-plan
    step:
      id: review-plan
      type: gate
      message: "Confirm module ownership, contracts, cost limits, risks, and verification strategy before generating tasks."
      options: [approve, reject]
      on_reject: abort

  - insert_after: tasks
    step:
      id: implementation-quality
      type: if
      condition: "{{ true }}"
      then:
        - id: analyze
          command: speckit.analyze
          integration: "{{ inputs.integration }}"
          input:
            args: "{{ inputs.spec }}"
        - id: implementation-readiness
          type: gate
          message: "Approve implementation only after analysis findings are resolved. Production UI work also requires a Verified prototype baseline."
          options: [approve, reject]
          on_reject: abort

  - insert_after: implement
    step:
      id: converge
      command: speckit.converge
      integration: "{{ inputs.integration }}"
      input:
        args: "{{ inputs.spec }}"
